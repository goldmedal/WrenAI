name: Publish context loader

on:
  push:
    tags:
      - 'context-loader-v*'

permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    name: Verify explicit tag version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Verify explicit tag version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#context-loader-v}"
          test -n "$version"
          test "$(node -p "require('./apps/context-loader/package.json').version")" = "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }} context loader
    needs: prepare
    runs-on: ${{ matrix.runner }}
    # The Linux legs build inside an old-glibc image so the binary runs on
    # Ubuntu 22.04+ and Debian 11+; the macOS leg builds on the runner itself.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
            rust_target: aarch64-apple-darwin
            runner: macos-14
            container: ''
          - target: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            container: rust:1.89-bullseye
          - target: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            container: rust:1.89-bullseye
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up locked Rust toolchain
        if: matrix.container == ''
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: ${{ matrix.rust_target }}

      - name: Add Rust components
        run: rustup component add rustfmt clippy

      - name: Test generator source
        working-directory: core/wren-context-loader
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build target archive
        id: archive
        shell: bash
        run: |
          cargo build --locked --release --target "${{ matrix.rust_target }}" --manifest-path core/wren-context-loader/Cargo.toml
          bin_dir="core/wren-context-loader/target/${{ matrix.rust_target }}/release"
          name="wren-context-loader-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.tar.gz"
          mkdir -p release
          tar -C "$bin_dir" -czf "release/$name" wren-context-loader
          printf 'name=%s\nbin_dir=%s\n' "$name" "$bin_dir" >> "$GITHUB_OUTPUT"

      - name: Smoke-run the built binary
        shell: bash
        run: |
          out="$("${{ steps.archive.outputs.bin_dir }}/wren-context-loader" --help 2>&1 || true)"
          grep -q "usage: wren-context-loader" <<<"$out"

      - name: Enforce the glibc floor
        if: startsWith(matrix.target, 'linux-')
        shell: bash
        run: |
          max="$(objdump -T "${{ steps.archive.outputs.bin_dir }}/wren-context-loader" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n 1)"
          echo "max glibc symbol version: $max"
          test "$(printf '%s\nGLIBC_2.31\n' "$max" | sort -V | tail -n 1)" = "GLIBC_2.31"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: release/${{ steps.archive.outputs.name }}
          if-no-files-found: error

  publish:
    name: Release and publish context loader
    needs: [prepare, build]
    runs-on: macos-14
    environment: npm
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up locked Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Download every target archive
        uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: release
          merge-multiple: true

      - name: Require exactly the three certified archives
        shell: bash
        run: |
          for target in darwin-arm64 linux-arm64 linux-x64; do
            test -f "release/wren-context-loader-${VERSION}-${target}.tar.gz"
          done
          test "$(find release -type f | wc -l | tr -d ' ')" = "3"

      - name: Create immutable release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/wren-context-loader-${{ needs.prepare.outputs.version }}-darwin-arm64.tar.gz
            release/wren-context-loader-${{ needs.prepare.outputs.version }}-linux-arm64.tar.gz
            release/wren-context-loader-${{ needs.prepare.outputs.version }}-linux-x64.tar.gz

      - name: Generate embedded manifest
        shell: bash
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/wren-context-loader-${VERSION}"
          node apps/context-loader/scripts/generate-release-manifest.mjs apps/context-loader "$VERSION" "$GITHUB_SHA" \
            darwin-arm64 "release/wren-context-loader-${VERSION}-darwin-arm64.tar.gz" "${base}-darwin-arm64.tar.gz" \
            linux-arm64 "release/wren-context-loader-${VERSION}-linux-arm64.tar.gz" "${base}-linux-arm64.tar.gz" \
            linux-x64 "release/wren-context-loader-${VERSION}-linux-x64.tar.gz" "${base}-linux-x64.tar.gz" \
            > release/context-loader-manifest.json
          cp release/context-loader-manifest.json "release/wren-context-loader-${VERSION}.manifest.json"

      - name: Validate installer contract
        working-directory: apps/context-loader
        run: node --test test/*.test.mjs

      - name: Verify every released row through the real installer
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { cp, mkdtemp } from "node:fs/promises";
          import os from "node:os";
          import path from "node:path";
          import { installContextLoader } from "./apps/context-loader/scripts/installer.mjs";
          for (const [platform, arch] of [["darwin", "arm64"], ["linux", "arm64"], ["linux", "x64"]]) {
            const root = await mkdtemp(path.join(os.tmpdir(), `context-loader-${platform}-${arch}-`));
            for (const file of ["package.json", "artifacts.json"]) await cp(path.join("apps/context-loader", file), path.join(root, file));
            await installContextLoader({ packageRoot: root, platform, arch });
            console.log(`verified ${platform}-${arch} release row`);
          }
          NODE

      - name: Run fresh GenBI package-binding contract
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @wrenai/genbi run build
          pnpm --filter @wrenai/genbi run check:installed-package

      - name: Pack and publish npm package with provenance
        working-directory: apps/context-loader
        run: |
          npm pack
          npm publish --provenance --access public

      - name: Upload machine-readable manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/wren-context-loader-${{ needs.prepare.outputs.version }}.manifest.json
