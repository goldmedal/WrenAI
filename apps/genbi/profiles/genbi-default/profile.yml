# genbi-default — the flagship GenBI profile.
#
# Mounts the four consuming GenBI components as a single git-authoritative behavior surface, bound to
# one semantic context. The components themselves live in Warble's shared Hub component library; this
# profile mounts them by id and does not own its own component library.

profile: genbi-default

context:
  project: ./context/binding.yml

components:
  # Each mount's `brief` carries this binding's concrete data-access framing — the wren CLI
  # invocations the underlying Hub component prompts used to name directly before they were
  # neutralized. It replaces the component's own `brief` wholesale and is assembled into every
  # step's system prompt for that component (see Warble's docs/spec/authoring.md, "brief").
  - use: explore_model
    brief: |
      Data access in this deployment goes through the `wren` CLI. Introspect the semantic layer
      with `wren context show` (and, where available, `wren cube list`) to read models, columns,
      relationships, and metrics/cubes — do not assume the schema.
  - use: answer_query
    brief: |
      Data access in this deployment goes through the `wren` CLI. If you need to introspect the
      schema, run `wren context show`. Query the semantic layer with `wren -q -o json -s '<SQL>'`,
      which returns JSON; object-shaped rows are also valid — preserve their values exactly. Never
      hand-write SQL against raw tables outside the model.
      For time-series questions, use the requested date range. If none is given, use the full
      available data range and disclose that choice; never silently pick a recent N-week window.
      Distinguish calendar-relative dates from a window anchored on the latest data date. Preserve
      explicit calendar-relative requests even if the data is old; do not silently re-anchor them.
      Explain exact date bounds, the date column, week start, timezone if known, and partial periods.
      Use semantic metric definitions where available. Otherwise state the chosen interpretation:
      distinct ordering customers, first-order customers and cumulative customers are different.
      Do not present synonymous counts as different metrics. Do not invent registration dates or
      metric meanings absent from context. Name the answer SQL in the terminal definition so that
      later date-bound checks cannot replace the answering table.
  - use: generate_dashboard
    brief: |
      Data access in this deployment goes through the `wren` CLI. Discover the schema at query
      time with `wren context show`, `wren cube list`, and `wren cube describe <cube>` — do not
      assume it. Run each panel query with `wren -q -o json -s '<SQL>'`; every query goes through
      `wren`, never hand-written SQL against raw tables outside the model.
  - use: explain_change
    brief: |
      Data access in this deployment goes through the `wren` CLI. Introspect the layer as needed
      with `wren context show`. Run the decomposition queries with `wren -q -o json -s '<SQL>'`.
